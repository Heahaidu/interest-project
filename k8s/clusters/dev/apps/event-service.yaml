apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-service
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: https://github.com/Heahaidu/interest-project
    targetRevision: main
    path: k8s/manifests/services/event-service/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
