apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace

spec: 
  project: default
  source:
    repoURL: https://github.com/Heahaidu/interest-project
    path: k8s/shared/namespaces
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true