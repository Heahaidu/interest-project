apiVersion: apps/v1
kind: Deployment
metadata: 
  name: kafka
spec: 
  replicas: 1
  strategy: 
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector: 
    matchLabels:
      app: kafka
  template:
    metadata: 
      labels:
        app: kafka
    spec: 
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          ports:
            - name: http
              containerPort: 9092
          envFrom: 
            - configMapRef:
                name: kafka-configmap