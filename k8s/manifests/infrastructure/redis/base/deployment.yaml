apiVersion: apps/v1
kind: Deployment
metadata: 
  name: redis
spec: 
  replicas: 1
  strategy: 
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector: 
    matchLabels:
      app: redis
  template:
    metadata: 
      labels:
        app: redis
    spec: 
      containers:
        - name: redis
          image: redis:7
          ports:
            - name: http
              containerPort: 6379
