apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service-dev
  template:
    spec:
      containers: 
        - name: chatbot-service
          image: heahaidu/interest.chatbot-service
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 192Mi