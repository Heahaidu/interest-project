apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service-dev
  template:
    spec:
      containers: 
        - name: notification-service
          image: heahaidu/interest.notification-service
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 192Mi