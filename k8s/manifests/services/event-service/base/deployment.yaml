apiVersion: apps/v1
kind: Deployment
metadata: 
  name: event-service-dev
spec: 
  replicas: 1
  strategy: 
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector: 
    matchLabels:
      app: event-service-dev
  template:
    metadata: 
      labels:
        app: event-service-dev
    spec: 
      containers:
        - name: event-service
          image: heahaidu/interest.event-service
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_SOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: event-db-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: event-db-secret
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: event-service-configmap