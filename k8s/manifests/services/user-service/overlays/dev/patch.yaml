apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-dev    
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service-dev
  template:
    spec:
      containers: 
        - name: user-service
          image: heahaidu/interest.user-service
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 192Mi