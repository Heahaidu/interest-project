apiVersion: apps/v1
kind: Deployment
metadata: 
  name: user-service
spec: 
  replicas: 1
  strategy: 
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector: 
    matchLabels:
      app: user-service
  template:
    metadata: 
      labels:
        app: user-service
    spec: 
      containers:
        - name: user-service
          image: heahaidu/interest.user-service
          ports:
            - name: http
              containerPort: 8080
