apiVersion: apps/v1
kind: Deployment
metadata: 
  name: user-service-dev
spec: 
  replicas: 1
  strategy: 
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector: 
    matchLabels:
      app: user-service-dev
  template:
    metadata: 
      labels:
        app: user-service-dev
    spec: 
      containers:
        - name: user-service
          image: heahaidu/interest.user-service
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: user-service-configmap
          env:
            - name: DATA_SOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: POSTGRES_PASSWORD
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: MAIL_PASSWORD